#==============================================================================
# Author(s): Seth Moore (slmoore@hamilton.edu)
# Brief: Simple memcached deployment
#==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: memcached
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcached-deployment
  namespace: memcached
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memcached
  template:
    metadata:
      labels:
        app: memcached
    spec:
      containers:
      - name: memcached
        image: memcached:1.6-alpine
        ports:
        - containerPort: 11211
---
apiVersion: v1
kind: Service
metadata:
  name: memcached-service
  namespace: memcached
spec:
  selector:
    app: memcached
  ports:
  - protocol: TCP
    port: 11211
    targetPort: 11211